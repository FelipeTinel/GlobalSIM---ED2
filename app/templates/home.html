<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSIM</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        window.initialPoint = {{ point | tojson }};
    </script>
    <script defer type="module" src="{{ url_for('static', filename='js/home.js') }}"></script>
</head>
<body>
    <h1>GlobalSIM</h1>

    <div class="dashboard-container">
        <div id="map"></div>

        <aside class="sidebar-panel">
            <h2>Países</h2>
            <input type="search" id="country-search" placeholder="Buscar país..." autocomplete="off">
            <ul id="country-list"></ul>
        </aside>
    </div>

    <section class="details-panel" id="details-panel">
        <p class="placeholder">Selecione um país no mapa ou na lista para ver os detalhes.</p>
    </section>
</body>
